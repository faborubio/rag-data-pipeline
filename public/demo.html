<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Data Pipeline — Demo</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --muted:#94a3b8; --accent:#6366f1; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --text:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:18px 24px; border-bottom:1px solid #334155; display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    header .tag { font-size:12px; color:var(--muted); }
    .wrap { display:grid; grid-template-columns: 360px 1fr; gap:18px; padding:18px; max-width:1200px; margin:0 auto; }
    .panel { background:var(--panel); border:1px solid #334155; border-radius:12px; padding:16px; }
    .panel h2 { font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    input, textarea, button { font:inherit; }
    input[type=text], input[type=password], textarea { width:100%; background:#0b1220; border:1px solid #334155; color:var(--text); border-radius:8px; padding:10px; }
    textarea { resize:vertical; min-height:64px; }
    button { background:var(--accent); color:white; border:none; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:600; }
    button:hover { filter:brightness(1.1); } button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    .muted { color:var(--muted); font-size:12px; }
    .doc { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid #334155; border-radius:8px; margin-bottom:8px; font-size:14px; }
    .badge { font-size:11px; padding:2px 8px; border-radius:999px; }
    .badge.completed { background:rgba(34,197,94,.15); color:var(--ok); }
    .badge.processing { background:rgba(245,158,11,.15); color:var(--warn); }
    .badge.failed { background:rgba(239,68,68,.15); color:var(--err); }
    #chat { display:flex; flex-direction:column; height:calc(100vh - 260px); min-height:360px; }
    #messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:4px; }
    .msg { max-width:85%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; }
    .msg.user { align-self:flex-end; background:var(--accent); }
    .msg.bot { align-self:flex-start; background:#0b1220; border:1px solid #334155; }
    .msg.bot.abstain { border-color:var(--warn); color:var(--warn); }
    .sources { margin-top:8px; font-size:12px; color:var(--muted); }
    .sources b { color:var(--text); }
    .meta { margin-top:8px; font-size:11px; color:var(--muted); }
    .meta .pill { background:#0b1220; border:1px solid #334155; border-radius:999px; padding:1px 8px; margin-right:6px; }
    .meta .pill.cache { color:var(--ok); border-color:rgba(34,197,94,.4); }
    sup.cite { color:var(--accent); font-weight:700; font-size:11px; }
    .feedback { margin-top:8px; display:flex; align-items:center; gap:6px; }
    .feedback .fb { background:#0b1220; border:1px solid #334155; padding:2px 8px; font-size:13px; }
    .feedback .fb:hover { border-color:var(--accent); }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .chip { font-size:12px; background:#0b1220; border:1px solid #334155; color:var(--text); border-radius:999px; padding:5px 10px; cursor:pointer; font-weight:400; }
    .chip:hover { border-color:var(--accent); }
    .stat { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
    .stat b { color:var(--text); } .stat span { color:var(--muted); }
    .note { font-size:12px; background:#0b1220; border:1px dashed #334155; border-radius:8px; padding:10px; color:var(--muted); }
    code { background:#0b1220; padding:1px 6px; border-radius:4px; }
    .gap { font-size:12px; color:var(--muted); padding:2px 0; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 RAG Data Pipeline</h1>
    <span class="tag" id="headerTag">demo pública · solo lectura · streaming · sabe cuándo no responder</span>
  </header>

  <div class="wrap">
    <!-- LEFT: demo info, documents, analytics -->
    <div>
      <input id="apiKey" type="hidden" />
      <div class="panel">
        <h2>Cuenta</h2>
        <div id="sessionInfo"></div>
        <div id="authForm" style="display:none;margin-top:10px">
          <input id="email" type="email" placeholder="email" autocomplete="username" style="margin-bottom:6px" />
          <input id="password" type="password" placeholder="contraseña (mín. 8)" autocomplete="current-password" style="margin-bottom:8px" />
          <div class="row" style="margin-bottom:0">
            <button onclick="submitAuth('login')" style="flex:1">Entrar</button>
            <button onclick="submitAuth('signup')" style="flex:1;background:#0b1220;border:1px solid #334155">Crear cuenta</button>
          </div>
          <div class="muted" id="authNote" style="margin-top:8px"></div>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2 id="demoTitle">Demo</h2>
        <div class="note" id="demoNote">Cargando la demo…</div>
      </div>

      <div class="panel" id="uploadPanel" style="margin-top:14px;display:none">
        <h2>Subir documento</h2>
        <div class="row">
          <input id="file" type="file" accept=".pdf,.txt,.md" />
        </div>
        <button id="uploadBtn" style="width:100%" onclick="upload()">Subir e ingerir</button>
        <div class="muted" id="uploadNote" style="margin-top:8px">PDF, TXT o Markdown.</div>
        <div class="muted" id="quota" style="margin-top:10px"></div>
        <div style="height:6px;background:#0b1220;border:1px solid #334155;border-radius:999px;overflow:hidden;margin-top:6px">
          <div id="quotaBar" style="height:100%;width:0%;background:var(--accent);transition:width .3s"></div>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2>Documentos <button style="float:right;padding:4px 10px;font-size:12px" onclick="loadDocs()">↻</button></h2>
        <div id="docs"><div class="muted">Cargando documentos…</div></div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2>Analítica <button style="float:right;padding:4px 10px;font-size:12px" onclick="loadAnalytics()">↻</button></h2>
        <div id="analytics"><div class="muted">Sin consultas todavía.</div></div>
      </div>
    </div>

    <!-- RIGHT: chat -->
    <div class="panel" id="chat">
      <h2>Chat sobre tus documentos</h2>
      <div id="messages"></div>
      <div class="muted" id="selInfo" style="margin:8px 0"></div>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:4px">
        <textarea id="question" placeholder="¿Qué hago en caso de incendio?"></textarea>
      </div>
      <button id="askBtn" onclick="ask()">Preguntar (streaming)</button>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const selected = new Set();
    // Suggested questions — the last one is deliberately off-topic to show the
    // model abstaining instead of inventing an answer.
    const SUGGESTIONS = [
      "¿Qué hago en caso de incendio?",
      "¿Cuál es el punto de encuentro?",
      "¿Cuál es la capital de Francia? (fuera de tema)"
    ];

    function key() { return ($("apiKey").value || "").trim(); }
    function authHeaders(extra = {}) { return Object.assign({ "Authorization": "Bearer " + key() }, extra); }

    window.onload = async () => {
      renderChips();
      await initSession();
    };

    // Two modes from one page: a saved login (localStorage) → personal mode on the
    // user's own writable tenant (upload enabled); otherwise the anonymous public
    // read-only demo via /api/v1/demo. The backend is always the real gate.
    async function initSession() {
      selected.clear(); $("messages").innerHTML = ""; $("uploadPanel").style.display = "none";
      const savedKey = localStorage.getItem("ragApiKey");
      const savedEmail = localStorage.getItem("ragEmail");

      if (savedKey) {
        $("apiKey").value = savedKey;
        setSessionUI(savedEmail);
        $("demoTitle").textContent = "Tu espacio";
        $("demoNote").innerHTML = `Sesión de <b>${escapeHtml(savedEmail)}</b>. Sube tus documentos (PDF/TXT/MD) y pregúntales.`;
        $("headerTag").textContent = "sesión personal · subida habilitada · streaming · sabe cuándo no responder";
        $("uploadPanel").style.display = "";
        loadStorage();
        await loadDocs();
        loadAnalytics();
        return;
      }

      setSessionUI(null);
      try {
        const r = await fetch("/api/v1/demo");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        $("apiKey").value = j.api_key;
        $("demoTitle").textContent = "Demo de solo lectura";
        $("demoNote").innerHTML = `Conectado al tenant <b>${escapeHtml(j.tenant)}</b> (solo lectura). Pregunta sobre el corpus — o <b>inicia sesión</b> para subir tus propios documentos.`;
        $("headerTag").textContent = "demo pública · solo lectura · streaming · sabe cuándo no responder";
        if (j.can_upload) { $("uploadPanel").style.display = ""; loadStorage(); }
        await loadDocs();
        loadAnalytics();
      } catch (e) {
        $("demoNote").textContent = "No se pudo iniciar la demo: " + e.message;
        $("docs").innerHTML = `<div class="muted">Demo no disponible.</div>`;
      }
    }

    function setSessionUI(email) {
      if (email) {
        $("sessionInfo").innerHTML = `Sesión: <b>${escapeHtml(email)}</b> · <a href="#" onclick="logout();return false" style="color:var(--accent)">salir</a>`;
        $("authForm").style.display = "none";
      } else {
        $("sessionInfo").innerHTML = `<button onclick="toggleAuth()" style="width:100%">Entrar / Registrarse</button>`;
      }
    }
    function toggleAuth() { const f = $("authForm"); f.style.display = f.style.display === "none" ? "" : "none"; }

    async function submitAuth(mode) {
      const email = $("email").value.trim(), password = $("password").value;
      if (!email || !password) { $("authNote").textContent = "Email y contraseña requeridos."; return; }
      try {
        const r = await fetch(mode === "signup" ? "/api/v1/signup" : "/api/v1/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { $("authNote").textContent = j.error || ("Error " + r.status); return; }
        localStorage.setItem("ragApiKey", j.api_key);
        localStorage.setItem("ragEmail", j.email);
        $("password").value = ""; $("authNote").textContent = "";
        await initSession();
      } catch (e) { $("authNote").textContent = "Error de red: " + e.message; }
    }

    function logout() {
      localStorage.removeItem("ragApiKey"); localStorage.removeItem("ragEmail");
      initSession();
    }

    function renderChips() {
      $("chips").innerHTML = SUGGESTIONS.map(q =>
        `<span class="chip" onclick="useSuggestion(this)">${escapeHtml(q)}</span>`).join("");
    }
    function useSuggestion(el) {
      $("question").value = el.textContent.replace(/\s*\(fuera de tema\)$/, "");
      ask();
    }

    async function loadDocs() {
      if (!key()) return;
      try {
        const r = await fetch("/api/v1/documents", { headers: authHeaders() });
        if (!r.ok) { $("docs").innerHTML = `<div class="muted">Error ${r.status} (¿API key válida?)</div>`; return; }
        const docs = await r.json();
        if (!docs.length) { $("docs").innerHTML = `<div class="muted">Aún no hay documentos.</div>`; return; }
        // Auto-select every completed document so the user can ask right away.
        docs.forEach(d => { if (d.status === "completed") selected.add(d.id); });
        $("docs").innerHTML = docs.map(d => `
          <div class="doc">
            <input type="checkbox" ${selected.has(d.id) ? "checked" : ""} onchange="toggle('${d.id}', this.checked)" ${d.status === 'completed' ? '' : 'disabled'} />
            <span style="flex:1">${escapeHtml(d.filename)} <span class="muted">· ${d.chunks} chunks</span></span>
            <span class="badge ${d.status}">${d.status}</span>
          </div>`).join("");
        updateSel();
      } catch (e) { $("docs").innerHTML = `<div class="muted">Error de red.</div>`; }
    }
    function toggle(id, on) { on ? selected.add(id) : selected.delete(id); updateSel(); }
    function updateSel(){ $("selInfo").textContent = selected.size ? `${selected.size} documento(s) seleccionado(s)` : "Selecciona documentos (completados) para preguntar."; }

    // Storage quota: fills the counter/bar and gates the next upload size.
    let maxUploadMb = Infinity;
    async function loadStorage() {
      if (!key()) return;
      try {
        const r = await fetch("/api/v1/storage", { headers: authHeaders() });
        if (!r.ok) return;
        const s = await r.json();
        maxUploadMb = s.max_upload_mb;
        const pct = s.budget_mb ? Math.min(100, Math.round(100 * s.used_mb / s.budget_mb)) : 0;
        $("quotaBar").style.width = pct + "%";
        $("quotaBar").style.background = pct >= 90 ? "var(--warn)" : "var(--accent)";
        $("quota").innerHTML = `Espacio: <b>${s.used_mb}</b> / ${s.budget_mb} MB usados · puedes subir hasta <b>${s.max_upload_mb} MB</b>`;
      } catch (e) { /* counter is best-effort */ }
    }

    // Upload (writable tenant only). POSTs the file, then polls loadDocs() until
    // the new document finishes ingesting, and auto-selects it so you can ask.
    async function upload() {
      const f = $("file").files[0];
      if (!f) return alert("Elige un archivo (.pdf, .txt o .md).");
      const mb = f.size / (1024 * 1024);
      if (mb > maxUploadMb) return alert(`"${f.name}" pesa ${mb.toFixed(1)} MB y supera el espacio disponible (${maxUploadMb} MB).`);
      $("uploadBtn").disabled = true;
      $("uploadNote").textContent = `Subiendo ${f.name}…`;
      try {
        const body = new FormData(); body.append("file", f);
        // No Content-Type: the browser sets the multipart boundary itself.
        const r = await fetch("/api/v1/documents", { method: "POST", headers: authHeaders(), body });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { $("uploadNote").textContent = "Error: " + (j.error || ("HTTP " + r.status)); return; }
        $("file").value = "";
        $("uploadNote").textContent = `“${j.filename}” en proceso…`;
        loadStorage(); // byte_size counts from document creation
        await pollUntilReady(j.id, j.filename);
      } catch (e) {
        $("uploadNote").textContent = "Error de red: " + e.message;
      } finally {
        $("uploadBtn").disabled = false;
      }
    }

    async function pollUntilReady(id, filename) {
      for (let i = 0; i < 30; i++) {            // ~60s máx (2s × 30)
        await new Promise(res => setTimeout(res, 2000));
        await loadDocs();                        // repinta badges processing→completed
        let status = null;
        try {
          const r = await fetch("/api/v1/documents/" + id, { headers: authHeaders() });
          if (r.ok) status = (await r.json()).status;
        } catch (e) { /* reintenta */ }
        if (status === "completed") {
          selected.add(id); updateSel(); await loadDocs();
          $("uploadNote").textContent = `“${filename}” listo ✓ — ya puedes preguntar.`;
          return;
        }
        if (status === "failed") {
          $("uploadNote").textContent = `“${filename}” falló al procesar.`;
          return;
        }
      }
      $("uploadNote").textContent = `“${filename}” sigue procesando — refresca documentos en un momento.`;
    }

    async function loadAnalytics() {
      if (!key()) return;
      try {
        const r = await fetch("/api/v1/analytics", { headers: authHeaders() });
        if (!r.ok) return;
        const a = await r.json();
        if (!a.total) { $("analytics").innerHTML = `<div class="muted">Sin consultas todavía.</div>`; return; }
        const rate = Math.round(100 * a.answered / a.total);
        const cache = Math.round(100 * a.cache_hit_rate);
        let html = `
          <div class="stat"><span>Consultas</span><b>${a.total}</b></div>
          <div class="stat"><span>Respondidas</span><b>${a.answered} (${rate}%)</b></div>
          <div class="stat"><span>Abstenciones</span><b>${a.abstained}</b></div>
          <div class="stat"><span>Cache hits</span><b>${cache}%</b></div>
          <div class="stat"><span>Feedback</span><b>👍 ${a.thumbs_up || 0} · 👎 ${a.thumbs_down || 0}</b></div>`;
        if (a.top_questions && a.top_questions.length) {
          html += `<div class="muted" style="margin-top:10px">Más preguntadas</div>` +
            a.top_questions.slice(0, 4).map(q => `<div class="gap">· ${escapeHtml(q.question)} <b>×${q.count}</b></div>`).join("");
        }
        if (a.content_gaps && a.content_gaps.length) {
          html += `<div class="muted" style="margin-top:10px">Vacíos de contenido (sin respuesta)</div>` +
            a.content_gaps.slice(0, 4).map(q => `<div class="gap">· ${escapeHtml(q.question)} <b>×${q.count}</b></div>`).join("");
        }
        $("analytics").innerHTML = html;
      } catch (e) { /* analytics is best-effort */ }
    }

    async function ask() {
      const q = $("question").value.trim();
      if (!q) return;
      if (!selected.size) return alert("Selecciona al menos un documento completado.");
      addMsg("user", q);
      $("question").value = "";
      const bot = addMsg("bot", "");
      $("askBtn").disabled = true;
      try {
        const r = await fetch("/api/v1/chats/query", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ question: q, document_ids: [...selected], stream: true })
        });
        if (!r.ok || !r.body) { bot.textContent = "Error: " + r.status; return; }
        const reader = r.body.getReader(); const dec = new TextDecoder();
        let buf = "", answer = "";
        while (true) {
          const { done, value } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true });
          let i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            const raw = buf.slice(0, i); buf = buf.slice(i + 2);
            let ev = "message", data = "";
            raw.split("\n").forEach(l => { if (l.startsWith("event:")) ev = l.slice(6).trim(); else if (l.startsWith("data:")) data += l.slice(5).trim(); });
            if (!data) continue;
            const payload = JSON.parse(data);
            if (ev === "token") { answer += payload.delta || ""; bot.textContent = answer; scroll(); }
            else if (ev === "done") { finishAnswer(bot, answer, payload); scroll(); }
          }
        }
      } catch (e) { bot.textContent = "Error de red: " + e.message; }
      finally { $("askBtn").disabled = false; loadAnalytics(); }
    }

    function finishAnswer(bot, answer, payload) {
      const sources = payload.sources || [];
      const abstained = sources.length === 0;
      bot.innerHTML = highlightCitations(answer); // re-render with [n] highlighted
      if (abstained) bot.classList.add("abstain");
      renderSources(bot, sources);
      renderMeta(bot, payload, abstained);
      if (!abstained) renderFeedback(bot, payload.query_id);
    }
    function highlightCitations(text) {
      return escapeHtml(text).replace(/\[(\d+)\]/g, '<sup class="cite">[$1]</sup>');
    }
    function renderFeedback(bot, queryId) {
      if (!queryId) return;
      const f = document.createElement("div"); f.className = "feedback";
      f.innerHTML = `<span class="muted">¿Útil?</span>
        <button class="fb" onclick="sendFeedback(this,'${queryId}',1)">👍</button>
        <button class="fb" onclick="sendFeedback(this,'${queryId}',-1)">👎</button>`;
      bot.appendChild(f);
    }
    async function sendFeedback(btn, queryId, rating) {
      const box = btn.parentElement;
      try {
        await fetch("/api/v1/feedback", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ query_id: queryId, rating })
        });
        box.innerHTML = `<span class="muted">¡Gracias! ${rating > 0 ? "👍" : "👎"}</span>`;
        loadAnalytics();
      } catch (e) { box.innerHTML = `<span class="muted">No se pudo enviar el voto.</span>`; }
    }
    function renderMeta(bot, payload, abstained) {
      const m = document.createElement("div"); m.className = "meta";
      const pills = [];
      if (typeof payload.latency_ms === "number") pills.push(`<span class="pill">⏱ ${payload.latency_ms} ms</span>`);
      pills.push(payload.cache_hit ? `<span class="pill cache">⚡ caché</span>` : `<span class="pill">generado</span>`);
      if (abstained) pills.push(`<span class="pill">✋ fuera del corpus</span>`);
      m.innerHTML = pills.join("");
      bot.appendChild(m);
    }
    function addMsg(role, text) { const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text; $("messages").appendChild(d); scroll(); return d; }
    function renderSources(bot, sources) {
      if (!sources.length) return;
      const s = document.createElement("div"); s.className = "sources";
      s.innerHTML = "<b>Fuentes:</b><br/>" + sources.map((x, i) => `<b>[${i + 1}]</b> pág. ${x.page}: ${escapeHtml(x.text_snippet || "")}`).join("<br/>");
      bot.appendChild(s);
    }
    function scroll(){ $("messages").scrollTop = $("messages").scrollHeight; }
    function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  </script>
</body>
</html>
