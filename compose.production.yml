name: rag-pipeline

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag_data_proyecto_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_data_proyecto_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD}@db:5432/rag_data_proyecto_production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SOLID_QUEUE_IN_PUMA: "1"
      # Single-mode Puma (0 = no cluster). WEB_CONCURRENCY=1 still forks a cluster
      # with one worker — pure overhead — and would load the ~767MB of ONNX models
      # (e5 embedder + jina reranker) once PER worker. Single mode keeps one process
      # with RAILS_MAX_THREADS threads; ONNX inference is a C extension that releases
      # the GVL, so those threads still use both dedicated cores during inference.
      WEB_CONCURRENCY: "0"
      # Headroom so SSE streams (each holds a thread for the response) don't
      # starve health checks / normal requests. The DB pool tracks this value.
      RAILS_MAX_THREADS: "6"
      # Local ONNX embedder (e5-small, baked into the image): no API, no rate
      # limit. Takes priority over GEMINI_API_KEY. See docs/AUDIT.md.
      EMBEDDER: "local"
      # Kept for fallback/optional use; EMBEDDER=local wins over it.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Use the multilingual cross-encoder reranker (model baked into the image).
      RERANKER: "neural"
      # Bearer token for GET /metrics. In production the endpoint is fail-closed
      # (401 without a valid token), so set this in .env to keep internal
      # Prometheus scraping working. The edge (Caddy) also returns 403 externally.
      METRICS_TOKEN: ${METRICS_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy with automatic HTTPS (Let's Encrypt) for the DuckDNS domain.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
