name: rag-pipeline

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag_data_proyecto_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_data_proyecto_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD}@db:5432/rag_data_proyecto_production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SOLID_QUEUE_IN_PUMA: "1"
      WEB_CONCURRENCY: "1"
      # Headroom so SSE streams (each holds a thread for the response) don't
      # starve health checks / normal requests. The DB pool tracks this value.
      RAILS_MAX_THREADS: "6"
      # Local ONNX embedder (e5-small, baked into the image): no API, no rate
      # limit. Takes priority over GEMINI_API_KEY. See AUDIT.md.
      EMBEDDER: "local"
      # Kept for fallback/optional use; EMBEDDER=local wins over it.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Use the multilingual cross-encoder reranker (model baked into the image).
      RERANKER: "neural"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy with automatic HTTPS (Let's Encrypt) for the DuckDNS domain.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
